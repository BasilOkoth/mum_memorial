services:
  - type: web
    name: memorial-candle
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/memorial.db
      - key: MEMORIAL_NAME
        sync: false
      - key: MEMORIAL_MESSAGE
        sync: false
      - key: BURIAL_DATE
        sync: false
      - key: BURIAL_VENUE
        sync: false
      - key: PHOTO_URL
        value: /static/mum.jpg
      - key: MPESA_NUMBER
        sync: false
      - key: MPESA_NAME
        sync: false
      - key: CONTRIBUTION_PURPOSE
        sync: false
      - key: ORGANIZER_PHONE
        sync: false
    disk:
      name: memorial-data
      mountPath: /var/data
      sizeGB: 1
